# Checks, tests and builds every push to main and every pull request. The release workflow runs it too,
# and only then does the build go up as the site to deploy.
name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch makes the run in progress pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types, lint, formatting and unused code
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Upload the site
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
